name: security gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engines
        run: |
          python -m pip install -e ".[dev]"
          pip install pyrit deepteam sentry-sdk
          npm install -g promptfoo
      - uses: ./
        with:
          update-baseline: "false"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .gatecheck/results.sarif
