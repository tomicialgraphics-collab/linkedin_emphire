tools:
  - gatecheck

target:
  url: http://127.0.0.1:8100/chat
  message_key: message
  reply_key: reply
  actions_key: actions

policy:
  data-exfiltration: critical
  tool-misuse: critical
  prompt-injection: high
  multi-turn-escalation: high
  system-prompt-leak: medium
  encoding-bypass: medium

gate:
  fail_on:
    - critical
    - high
  repeat: 3
  min_repro: 1
  # Its own record again: a different runtime is a different target, and a
  # baseline from another agent would report every difference as a change.
  baseline: .gatecheck/pydantic-baseline.json
