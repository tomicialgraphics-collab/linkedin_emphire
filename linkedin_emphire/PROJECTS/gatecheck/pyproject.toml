[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatecheck"
version = "0.4.0"
description = "A security gate for AI agents: blocks a pull request only when the agent got easier to break."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Timothy Olusanya" }]
keywords = ["ai-security", "red-teaming", "ci", "sarif", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# The three engines are optional on purpose: a gate that needs all three
# installed is a gate nobody runs. Each degrades to "skipped, with reason".
engines = []
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
gatecheck = "gatecheck.cli:main"

[tool.setuptools.packages.find]
include = ["gatecheck*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
