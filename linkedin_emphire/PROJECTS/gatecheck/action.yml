name: gatecheck
description: Fail the pull request only when the agent got easier to break.
branding:
  icon: shield
  color: gray-dark
inputs:
  config:
    description: Path to gatecheck.yml
    required: false
    default: gatecheck.yml
  tools:
    description: Comma list of engines to run (gatecheck,deepteam,pyrit,promptfoo)
    required: false
    default: ""
  fail-on:
    description: Comma list of severities that block
    required: false
    default: critical,high
  update-baseline:
    description: Refresh the baseline after a complete run (refused when an engine was skipped or nothing ran)
    required: false
    default: "false"
  sarif-file:
    description: Where to write SARIF for the code scanning upload
    required: false
    default: .gatecheck/results.sarif
  comment:
    description: Post the markdown comment on the pull request
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install gatecheck
      shell: bash
      run: python -m pip install -e "${{ github.action_path }}"

    - name: Run the gate
      id: gate
      shell: bash
      run: |
        set +e
        python -m gatecheck run \
          --config "${{ inputs.config }}" \
          ${INPUTS_TOOLS:+--tools "$INPUTS_TOOLS"} \
          ${INPUTS_FAIL_ON:+--fail-on "$INPUTS_FAIL_ON"} \
          --out .gatecheck/runs/latest \
          ${INPUTS_UPDATE_BASELINE:+--update-baseline}
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        cp .gatecheck/runs/latest/results.sarif "${{ inputs.sarif-file }}" 2>/dev/null || true
        exit 0
      env:
        INPUTS_TOOLS: ${{ inputs.tools }}
        INPUTS_FAIL_ON: ${{ inputs.fail-on }}
        INPUTS_UPDATE_BASELINE: ${{ inputs.update-baseline == 'true' && '1' || '' }}
        PROMPTFOO_DISABLE_TELEMETRY: "1"

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file .gatecheck/runs/latest/comment.md

    - name: Fail if blocked
      if: steps.gate.outputs.exit_code != '0'
      shell: bash
      run: |
        echo "gatecheck blocked this change (exit ${{ steps.gate.outputs.exit_code }})"
        exit 1
